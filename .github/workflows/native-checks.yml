on:
  push:
    branches: [main, master]
  pull_request:
    types: [opened, synchronize, reopened, labeled]

name: native-checks

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# `profile` goes to the four workflows it changes: quick skips the asan
# containers, valgrind and cran-special. lto, rchk and analyzers take
# minutes either way and run on every push.
#
# gctorture has a policy of its own: the quick run (step 500, minutes) on
# every push, and the long one (step 20 over a sample of the oracle, about
# an hour) only on a pull request labelled `gctorture`, one that changes
# how the glue allocates or protects. gctorture.yaml runs the long one
# weekly, so what a quick run misses is found within the week.
jobs:
  sanitizers:
    uses: pedrobtz/r-actions/.github/workflows/sanitizers.yml@v1
    with:
      asan: true
      profile: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'full-ci') && 'quick' || 'full' }}

  valgrind:
    uses: pedrobtz/r-actions/.github/workflows/valgrind.yml@v1
    with:
      profile: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'full-ci') && 'quick' || 'full' }}

  lto:
    uses: pedrobtz/r-actions/.github/workflows/lto.yml@v1

  gctorture:
    uses: pedrobtz/r-actions/.github/workflows/gctorture.yml@v1
    with:
      profile: ${{ contains(github.event.pull_request.labels.*.name, 'gctorture') && 'full' || 'quick' }}
      env: ${{ contains(github.event.pull_request.labels.*.name, 'gctorture') && 'ZUTEMPO_GCTORTURE_SAMPLE=true' || '' }}

  rchk:
    uses: pedrobtz/r-actions/.github/workflows/rchk.yml@v1
    with:
      fail-on-findings: true
      # The rchk image ignores `Remotes:`, so the sibling that zutempo
      # `LinkingTo`s is installed from GitHub. Drop this once zufast 0.1.1
      # is on CRAN (roadmap, open question 1).
      github-packages: |
        pedrobtz/zufast

  analyzers:
    uses: pedrobtz/r-actions/.github/workflows/analyzers.yml@v1

  cran-special:
    uses: pedrobtz/r-actions/.github/workflows/cran-special.yml@v1
    with:
      profile: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'full-ci') && 'quick' || 'full' }}
