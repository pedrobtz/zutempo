on:
  push:
    branches: [main, master]
  pull_request:
    types: [opened, synchronize, reopened, labeled]

name: native-checks

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# Every run is the quick one, each job under five minutes: UBSan and the
# ASan containers, rchk, LTO, the analyzers and CRAN's special checks run
# in full, since they take two or three minutes; valgrind is skipped and
# gctorture runs at step 1000 over a sample of the oracle. The `full-ci`
# label is the full run before submission (stage 13 of the roadmap):
# valgrind too, and gctorture at step 20. The `gctorture` label, or
# gctorture.yaml, runs the long gctorture alone.
jobs:
  sanitizers:
    uses: pedrobtz/r-actions/.github/workflows/sanitizers.yml@v1
    with:
      asan: true
      profile: full

  valgrind:
    uses: pedrobtz/r-actions/.github/workflows/valgrind.yml@v1
    with:
      profile: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') && 'full' || 'quick' }}

  lto:
    uses: pedrobtz/r-actions/.github/workflows/lto.yml@v1

  gctorture:
    uses: pedrobtz/r-actions/.github/workflows/gctorture.yml@v1
    with:
      profile: ${{ (contains(github.event.pull_request.labels.*.name, 'full-ci') || contains(github.event.pull_request.labels.*.name, 'gctorture')) && 'full' || 'quick' }}
      # The sampled oracle in both runs, and step 1000 for the quick one,
      # keep it under five minutes (298 s at step 500 on 2026-10-15) and
      # the long one inside its budget.
      quick-step: 1000
      env: ZUTEMPO_GCTORTURE_SAMPLE=true

  rchk:
    uses: pedrobtz/r-actions/.github/workflows/rchk.yml@v1
    with:
      fail-on-findings: true
      # The rchk image ignores `Remotes:`, so the sibling that zutempo
      # `LinkingTo`s is installed from GitHub. Drop this once zufast 0.1.1
      # is on CRAN (roadmap, open question 1).
      github-packages: |
        pedrobtz/zufast

  analyzers:
    uses: pedrobtz/r-actions/.github/workflows/analyzers.yml@v1

  cran-special:
    uses: pedrobtz/r-actions/.github/workflows/cran-special.yml@v1
    with:
      profile: full
