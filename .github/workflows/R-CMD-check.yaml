on:
  push:
    branches: [main, master]
  # `labeled` so that adding `full-ci` to a pull request reruns it in full.
  pull_request:
    types: [opened, synchronize, reopened, labeled]

name: R-CMD-check

permissions: read-all

# A new push to a pull request cancels the run it supersedes. Pushes to main
# get a group of their own, so every merge is checked and none is cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    uses: pedrobtz/r-actions/.github/workflows/r-cmd-check.yml@v1
    with:
      # Quick on each push to a pull request, full after merge. The
      # `full-ci` label runs the full set on a pull request before merging.
      profile: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'full-ci') && 'quick' || 'full' }}
      # The shared default plus Windows R-devel, CRAN's Windows flavour,
      # which no container covers. Runner legs run in the full profile only.
      runners: >-
        [{"os": "macos-latest", "r": "release"},
         {"os": "windows-latest", "r": "release"},
         {"os": "windows-latest", "r": "devel"},
         {"os": "ubuntu-latest", "r": "release"},
         {"os": "ubuntu-latest", "r": "oldrel-1"}]

  # The same check with zufast's 128-bit arithmetic built without the
  # compiler's __int128 (design 4.3). src/Makevars adds ZUTEMPO_CFLAGS to
  # PKG_CFLAGS, and test-info.R asserts that the flag reached the engine.
  R-CMD-check-no-int128:
    uses: pedrobtz/r-actions/.github/workflows/r-cmd-check.yml@v1
    with:
      profile: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'full-ci') && 'quick' || 'full' }}
      env: |
        ZUTEMPO_CFLAGS=-DZUF_NO_INT128

  # Every zone's UTC offset against base R's at every hour from 1900 to
  # 2100 (design 11, test-agreement.R): about a quarter of an hour, so it
  # runs on one Ubuntu leg of the full run before submission only. Every
  # other run checks transitions and a sample of hours in seconds.
  agreement:
    if: contains(github.event.pull_request.labels.*.name, 'full-ci')
    uses: pedrobtz/r-actions/.github/workflows/r-cmd-check.yml@v1
    with:
      profile: full
      runners: '[{"os": "ubuntu-latest", "r": "release"}]'
      containers: "[]"
      env: |
        ZUTEMPO_EXTENDED_TESTS=true
