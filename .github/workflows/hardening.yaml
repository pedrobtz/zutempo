# Two minutes per target on every pull request and push to main; thirty
# with the `full-ci` label or on demand, the long run before submission.
# The corpus cache is what makes the short runs add up to one campaign.
on:
  push:
    branches: [main, master]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

name: hardening

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  fuzz-tzif:
    uses: pedrobtz/r-actions/.github/workflows/fuzz.yml@v1
    with:
      harness: tools/fuzz/tzif.c
      sources: src/*.c
      # The glue and the entry point need R's headers; the engine does not.
      exclude-sources: |
        src/init.c
        src/ztp_r_*.c
      seed-corpus: tests/testthat/tzdata/slim
      github-packages: pedrobtz/zufast
      cflags: -g -O1 -fno-omit-frame-pointer -I.github-packages/zufast/inst/include
      max-total-time: ${{ (github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'full-ci')) && 1800 || 120 }}

  fuzz-rfc9557:
    uses: pedrobtz/r-actions/.github/workflows/fuzz.yml@v1
    with:
      harness: tools/fuzz/rfc9557.c
      sources: src/*.c
      exclude-sources: |
        src/init.c
        src/ztp_r_*.c
      # From tools/fuzz/seeds.mjs: the oracle's strings and test262's.
      seed-corpus: tools/fuzz/corpus/rfc9557
      github-packages: pedrobtz/zufast
      cflags: -g -O1 -fno-omit-frame-pointer -I.github-packages/zufast/inst/include
      max-total-time: ${{ (github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'full-ci')) && 1800 || 120 }}

  fuzz-duration:
    uses: pedrobtz/r-actions/.github/workflows/fuzz.yml@v1
    with:
      harness: tools/fuzz/duration.c
      sources: src/*.c
      exclude-sources: |
        src/init.c
        src/ztp_r_*.c
      # From tools/fuzz/seeds.mjs: the oracle's strings and test262's.
      seed-corpus: tools/fuzz/corpus/duration
      github-packages: pedrobtz/zufast
      cflags: -g -O1 -fno-omit-frame-pointer -I.github-packages/zufast/inst/include
      max-total-time: ${{ (github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'full-ci')) && 1800 || 120 }}
