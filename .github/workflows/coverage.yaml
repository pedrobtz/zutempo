on:
  push:
    branches: [main, master]
  pull_request:

name: coverage

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  coverage:
    # Pinned to a commit rather than a tag because the `badge` job holds a
    # write token. Bump the SHA and the comment together.
    uses: pedrobtz/r-actions/.github/workflows/coverage.yml@17264ce002a9359a492e0183852a555a5bb866e7 # v1.23.0
    permissions:
      contents: write
    with:
      # The default branch takes no direct pushes (ruleset), so the badge
      # commit goes to the pkgdown branch instead.
      badge-branch: gh-pages
      badge-path: badges/coverage.svg
